name: Build Gallery Pristine 1.0.23 (standard toolchain)

on:
  workflow_dispatch:

jobs:
  build_apk:
    name: Build Android APK (pristine tag 1.0.23)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Android/src
    steps:
      - name: Checkout tag 1.0.23 (exact commit)
        uses: actions/checkout@v4
        with:
          ref: 9cb31cf47c21b0ed76901ff589a52b509803edfa
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Android SDK Platform 37
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.0"
      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleRelease
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gallery-pristine-1.0.23-unsigned
          path: Android/src/app/build/outputs/apk/release/*.apk
